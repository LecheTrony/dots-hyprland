[General]
# Illogical-Impulse: dark anime SDDM theme.
# All keys below are read from QML via `config.<key>`; tune them freely.
#
# INSTALL (artix, root):
#   sudo cp -r ~/.local/share/sddm/themes/impulse /usr/share/sddm/themes/
#   sudo sed -i 's/^Current=.*/Current=impulse/' /etc/sddm.conf
# NOTE: /etc/sddm.conf takes precedence over /etc/sddm.conf.d/*.conf, so
# the theme must be activated by editing /etc/sddm.conf directly.
# Preview without rebooting:  sudo sddm --test-mode

Background=background-blur.jpg
Accent=#66C2FF
AccentHover=#9AD7FF
SurfaceOpacity=0.80
Blur=24
Vignette=0.48
Radius=22
CardWidth=440