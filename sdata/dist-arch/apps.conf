# Optional application catalogue for ./setup install
#
# This file is sourced by sdata/subcmd-install/4.apps.sh .
# It is ONLY used on Arch-based distros (OS_GROUP_ID=arch, includes Artix).
# On other distros the "4. Apps" step is skipped automatically.
#
# Format (one line per application):
#
#   APP <category> | <package> | <name> | <description>
#
#   <category>     One of the category keys defined in APPS_CATEGORY_* below.
#   <package>      Package name installed with pacman/yay. May be empty when
#                  the application is grouped into another install unit
#                  (see APPS_OTHER_PACKAGES), in which case it is still shown
#                  in the menu but contributes no package of its own.
#   <name>         Display name shown in the whiptail checklist.
#   <description>  Short description shown on the same line in brackets.
#
# Fields are separated by " | " (spaces around the pipe are trimmed).
# Lines starting with "#" and empty lines are ignored.

#####################################################################################
# Categories
# Format: KEY | Title | Short description
# The order here is the order shown in the menu.
#####################################################################################
CATEGORY games      | Juegos                  | Videojuegos, lanzadores y utilidades de gaming (Steam, Wine, MangoHud...)
CATEGORY browsers   | Navegadores             | Navegadores web y derivados (Firefox, Chrome, Brave, Tor...)
CATEGORY music      | Musica                  | Reproductores de música y audio (Audacious, Spotify, Pear Desktop)
CATEGORY editors    | Editores de código      | Editores de texto/código (VS Code, VSCodium, Neovim, Zed, Helix...)
CATEGORY devtools   | Herramientas de programación | Compiladores, gestores de paquetes, contenedores y utilidades CLI

#####################################################################################
# Applications
#####################################################################################

